<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="sastamaal.net app icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <!-- subtle sparkle accent -->
    <radialGradient id="sparkle" cx="0.3" cy="0.3" r="0.6">
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- outer glow halo -->
    <circle cx="256" cy="256" r="170" fill="#ffffff" opacity="0.06"/>
    <circle cx="400" cy="96" r="110" fill="#ffffff" opacity="0.05"/>
    <circle cx="100" cy="420" r="140" fill="#022c22" opacity="0.12"/>

    <!-- price-tag outline (rounded pillow shape with pin) -->
    <path
      d="M256 110 C346 110 418 182 418 272 C418 362 346 434 256 434 C166 434 94 362 94 272 C94 182 166 110 256 110 Z"
      fill="none" stroke="#ffffff" stroke-width="16" stroke-opacity="0.85"/>
    <!-- tag pin notch -->
    <path d="M170 272 L94 272" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- gold lightning bolt centered -->
    <path
      d="M300 170 L265 265 L298 265 L256 358 L292 265 L260 265 L292 170 Z"
      fill="url(#gold)"
      stroke="#ffffff" stroke-width="1"/>

    <!-- sparkle accent -->
    <rect x="0" y="0" width="512" height="512" fill="url(#sparkle)"/>
  </g>
</svg>
