<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" fill="none">
  <!-- Shield icon -->
  <path d="M10 8 L20 4 L30 8 L30 20 C30 28 20 34 20 34 C20 34 10 28 10 20 Z" fill="url(#emerald)" stroke="url(#emeraldStroke)" stroke-width="1.5"/>
  <!-- Lightning bolt inside shield -->
  <path d="M18 10 L16 18 L20 18 L17 26 L22 16 L18 16 Z" fill="#ffffff" opacity="0.95"/>
  <!-- Brand name: sastamaal -->
  <text x="36" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="white" letter-spacing="-0.5">sastamaal</text>
  <!-- .net suffix -->
  <text x="155" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#10b981" letter-spacing="-0.5">.net</text>
  <!-- Tagline -->
  <text x="36" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="500" fill="#94a3b8" letter-spacing="2" text-transform="uppercase">PAKISTAN&apos;S GADGET STORE</text>
  <defs>
    <linearGradient id="emerald" x1="10" y1="4" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="emeraldStroke" x1="10" y1="4" x2="30" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
</svg>
